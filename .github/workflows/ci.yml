name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Client
        working-directory: ./client
        run: npm run lint

      - name: Lint Server
        working-directory: ./server
        run: npm run lint

      - name: Run Server Tests
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/ecommerce_test

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Build Server
        working-directory: ./server
        run: npm run build
