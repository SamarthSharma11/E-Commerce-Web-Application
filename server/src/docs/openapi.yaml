  /admin/stats/top-products:
    get:
      summary: Top selling products
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 10
            maximum: 50
      responses:
        '200':
          description: Top products by quantity sold

  /admin/users:
    get:
      summary: List all users (Admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [customer, admin]
      responses:
        '200':
          description: Users list with pagination
        '403':
          description: Admin access required

  /admin/users/{id}/role:
    put:
      summary: Update user role (Admin only)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
