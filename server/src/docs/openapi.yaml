openapi: 3.0.3
info:
  title: ApexStore E-Commerce API
  description: |
    Full-stack e-commerce backend API with authentication, product management,
    cart, orders, payments (Razorpay), and admin dashboard.
  version: 1.0.0
  contact:
    name: ApexStore Team

servers:
  - url: http://localhost:5000/api
    description: Local development server

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Address:
      type: object
      required:
        - label
        - line1
        - city
        - state
        - pincode
        - country
      properties:
        label:
          type: string
          example: Home
        line1:
          type: string
          example: 123 Main Street
        line2:
          type: string
          example: Apartment 4B
        city:
          type: string
          example: Mumbai
        state:
          type: string
          example: Maharashtra
        pincode:
          type: string
          example: '400001'
        country:
          type: string
          example: India
        isDefault:
          type: boolean
          example: true

    ShippingAddress:
      type: object
      required:
        - fullName
        - line1
        - city
        - state
        - pincode
        - country
        - phone
      properties:
        fullName:
          type: string
          example: John Doe
        line1:
          type: string
          example: 123 Main Street
        line2:
          type: string
          example: Apartment 4B
        city:
          type: string
          example: Mumbai
        state:
          type: string
          example: Maharashtra
        pincode:
          type: string
          example: '400001'
        country:
          type: string
          example: India
        phone:
          type: string
          example: '+919876543210'

    PaymentInfo:
      type: object
      properties:
        method:
          type: string
          enum: [razorpay, cod, wallet]
          example: razorpay
        status:
          type: string
          enum: [pending, paid, failed, refunded]
          example: paid
        transactionId:
          type: string
          example: pay_29QQaUBzP6WgnI
        paidAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00.000Z'

    OrderItem:
      type: object
      properties:
        product:
          type: string
          example: 65a1b2c3d4e5f6001a2b3c4d
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          example: 2499.00
        quantity:
          type: number
          example: 2
        image:
          type: string
          example: https://example.com/image.jpg

    Order:
      type: object
      properties:
        _id:
          type: string
          example: 65a1b2c3d4e5f6001a2b3c4d
        user:
          type: string
          example: 65a1b2c3d4e5f6001a2b3c4e
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        paymentInfo:
          $ref: '#/components/schemas/PaymentInfo'
        itemsPrice:
          type: number
          example: 4998.00
        taxPrice:
          type: number
          example: 0
        shippingPrice:
          type: number
          example: 0
        totalPrice:
          type: number
          example: 4998.00
        orderStatus:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
          example: pending
        placedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        cancelReason:
          type: string
          example: Customer requested cancellation
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        _id:
          type: string
        product:
          type: string
        name:
          type: string
        image:
          type: string
        price:
          type: number
        quantity:
          type: number

    Cart:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        itemsCount:
          type: number
          example: 3
        subtotal:
          type: number
          example: 4998.00
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Wireless Headphones
        slug:
          type: string
          example: wireless-headphones
        description:
          type: string
          example: High-quality wireless headphones with noise cancellation
        price:
          type: number
          example: 2999.00
        discountPrice:
          type: number
          example: 2499.00
        category:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            slug:
              type: string
        brand:
          type: string
          example: SoundBrand
        images:
          type: array
          items:
            type: string
          example:
            - https://example.com/img1.jpg
            - https://example.com/img2.jpg
        stock:
          type: number
          example: 50
        sku:
          type: string
          example: SKU-ABC123
        ratingsAverage:
          type: number
          example: 4.5
        ratingsCount:
          type: number
          example: 120
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Electronics
        slug:
          type: string
          example: electronics
        description:
          type: string
          example: Electronic devices and gadgets
        image:
          type: string
          example: https://example.com/cat.jpg
        parentCategory:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            slug:
              type: string
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        _id:
          type: string
        user:
          type: object
          properties:
            _id:
              type: string
            name:
              type: string
            avatar:
              type: string
        product:
          type: string
        rating:
          type: number
          example: 5
        comment:
          type: string
          example: Great product, highly recommended!
        isVerifiedPurchase:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum: [customer, admin]
          example: customer
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phone:
          type: string
          example: '+919876543210'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        error:
          type: string
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        currentPage:
          type: number
        limit:
          type: number
        totalCount:
          type: number
        totalPages:
          type: number

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
        error:
          type: string

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123
                role:
                  type: string
                  enum: [customer, admin]
                  default: customer
                phone:
                  type: string
                  example: '+919876543210'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Refresh token required

  /auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset instructions sent if account exists

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated

  /auth/me/addresses:
    put:
      summary: Update user addresses
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addresses
              properties:
                addresses:
                  type: array
                  items:
                    $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Addresses updated
        '401':
          description: Not authenticated

  /categories:
    get:
      summary: List all categories
      tags: [Categories]
      parameters:
        - name: parentCategory
          in: query
          schema:
            type: string
          description: Filter by parent category ID or 'null' for root categories
        - name: search
          in: query
          schema:
            type: string
          description: Search by category name
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    post:
      summary: Create category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                image:
                  type: string
                parentCategory:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Category created
        '401':
          description: Not authenticated
        '403':
          description: Admin access required

  /categories/{slug}:
    get:
      summary: Get category by slug
      tags: [Categories]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
        '404':
          description: Category not found

  /categories/{id}:
    put:
      summary: Update category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                image:
                  type: string
                parentCategory:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
      responses:
        '200':
          description: Category updated
        '403':
          description: Admin access required

    delete:
      summary: Delete category (Admin only)
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category deleted
        '403':
          description: Admin access required
        '400':
          description: Cannot delete category with linked products or sub-categories

  /products:
    get:
      summary: List products
      tags: [Products]
      parameters:
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 12
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, newest, rating]
        - name: brand
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Products list with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    post:
      summary: Create product (Admin only)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                discountPrice:
                  type: number
                category:
                  type: string
                stock:
                  type: number
                sku:
                  type: string
                brand:
                  type: string
                isActive:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Product created
        '403':
          description: Admin access required

  /products/{slug}:
    get:
      summary: Get product by slug
      tags: [Products]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details with populated category and reviews
        '404':
          description: Product not found

  /products/{id}:
    put:
      summary: Update product (Admin only)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                discountPrice:
                  type: number
                category:
                  type: string
                stock:
                  type: number
                sku:
                  type: string
                brand:
                  type: string
                isActive:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Product updated
        '403':
          description: Admin access required

    delete:
      summary: Delete product (Admin only)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted
        '403':
          description: Admin access required

  /products/{productId}/reviews:
    get:
      summary: Get product reviews
      tags: [Reviews]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reviews list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    post:
      summary: Create review (Authenticated users)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
                - comment
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        '201':
          description: Review created
        '401':
          description: Not authenticated
        '400':
          description: Already reviewed or invalid input

  /reviews/{id}:
    delete:
      summary: Delete review (Owner or Admin)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted
        '401':
          description: Not authenticated
        '403':
          description: Not authorized

  /cart:
    get:
      summary: Get user cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart with populated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    post:
      summary: Add item to cart
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: number
                  minimum: 1
      responses:
        '201':
          description: Item added to cart
        '400':
          description: Invalid product or insufficient stock

    delete:
      summary: Clear cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared

  /cart/{productId}:
    put:
      summary: Update cart item quantity
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: number
                  minimum: 1
      responses:
        '200':
          description: Cart updated
        '404':
          description: Item not in cart

    delete:
      summary: Remove item from cart
      tags: [Cart]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed
        '404':
          description: Item not in cart

  /orders:
    post:
      summary: Create order from cart
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shippingAddress
                - paymentMethod
              properties:
                shippingAddress:
                  $ref: '#/components/schemas/ShippingAddress'
                paymentMethod:
                  type: string
                  enum: [razorpay, cod, wallet]
                paymentInfo:
                  $ref: '#/components/schemas/PaymentInfo'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Empty cart or insufficient stock

    get:
      summary: List all orders (Admin only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: user
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders list with pagination
        '403':
          description: Admin access required

  /orders/my-orders:
    get:
      summary: Get current user's orders
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        '200':
          description: User's orders with pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /orders/{id}:
    get:
      summary: Get order by ID
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
        '403':
          description: Not authorized
        '404':
          description: Order not found

    put:
      summary: Update order status (Admin only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderStatus
              properties:
                orderStatus:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
                cancelReason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Order status updated
        '403':
          description: Admin access required

  /payments/create-order:
    post:
      summary: Create Razorpay order
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  example: 4998.00
                currency:
                  type: string
                  default: INR
                receipt:
                  type: string
                notes:
                  type: object
      responses:
        '201':
          description: Razorpay order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                      amount:
                        type: number
                      currency:
                        type: string
                      key:
                        type: string
                      receipt:
                        type: string

  /payments/verify:
    post:
      summary: Verify Razorpay payment
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - razorpay_order_id
                - razorpay_payment_id
                - razorpay_signature
              properties:
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
                orderId:
                  type: string
      responses:
        '200':
          description: Payment verified
        '400':
          description: Invalid signature

  /payments/webhook:
    post:
      summary: Razorpay webhook
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook signature

  /admin/stats/summary:
