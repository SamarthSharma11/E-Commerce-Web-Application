      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /admin/stats/sales-over-time:
    get:
      summary: Sales over time (daily/monthly)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
